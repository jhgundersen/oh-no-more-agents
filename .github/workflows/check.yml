name: check

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          # Art tests compare against reference commits with git show.
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Ubuntu 24.04 blocks unprivileged user namespaces through AppArmor, so
      # Chromium's sandbox aborts at startup (SIGABRT) in every browser test.
      - run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      # The first headless launch on a fresh runner builds caches and can miss
      # a test's startup window; pay for it here. Also name the monospace font
      # the page's caption falls back to.
      - run: |
          chromium --version
          fc-match monospace
          timeout 120 chromium --headless=new --disable-gpu --dump-dom about:blank > /dev/null
      - run: npm run check
