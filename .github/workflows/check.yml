name: check

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          # Art tests compare against reference commits with git show.
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Ubuntu 24.04 blocks unprivileged user namespaces through AppArmor, so
      # Chromium's sandbox aborts at startup (SIGABRT) in every browser test.
      - run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - run: chromium --version
      - run: npm run check
